<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Report Checklist — DIA Project</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3248;
      --accent: #6c8ef5;
      --accent2: #a78bfa;
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #f87171;
      --text: #e2e8f0;
      --muted: #8892a4;
      --done-text: #4a5568;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 20px 60px;
    }
    .header {
      max-width: 780px;
      margin: 0 auto 32px;
    }
    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .header p {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .progress-bar-wrap {
      margin-top: 18px;
      background: var(--surface2);
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 999px;
      transition: width 0.4s ease;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .container {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .section-header:hover { background: #272b42; }
    .section-title {
      font-size: 0.88rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      flex: 1;
    }
    .section-badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .badge-high { background: #3b1f1f; color: var(--red); }
    .badge-med  { background: #3b2f0f; color: var(--yellow); }
    .badge-low  { background: #0f2a1e; color: var(--green); }
    .section-count {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .section-chevron {
      font-size: 0.75rem;
      color: var(--muted);
      transition: transform 0.2s;
    }
    .section-chevron.open { transform: rotate(180deg); }
    .items {
      display: none;
      flex-direction: column;
    }
    .items.open { display: flex; }
    .item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }
    .item:last-child { border-bottom: none; }
    .item:hover { background: #1e2236; }
    .item.done { opacity: 0.45; }
    .item.done .item-title { text-decoration: line-through; color: var(--done-text); }
    .checkbox {
      width: 20px;
      height: 20px;
      min-width: 20px;
      border-radius: 6px;
      border: 2px solid var(--border);
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
      transition: all 0.15s;
      font-size: 0.7rem;
    }
    .item.done .checkbox {
      background: var(--green);
      border-color: var(--green);
      color: #0f1117;
    }
    .item-content { flex: 1; }
    .item-title {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
    }
    .item-note {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.5;
    }
    .priority-dot {
      width: 7px; height: 7px;
      min-width: 7px;
      border-radius: 50%;
      margin-top: 7px;
    }
    .dot-high { background: var(--red); }
    .dot-med  { background: var(--yellow); }
    .dot-low  { background: var(--green); }

    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .filter-btn {
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>📝 Report Checklist</h1>
  <p>Things to work on while the adaptation experiment runs — click to tick off.</p>
  <div class="filter-bar" style="margin-top:16px">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('high', this)">🔴 High priority</button>
    <button class="filter-btn" onclick="setFilter('med', this)">🟡 Medium priority</button>
    <button class="filter-btn" onclick="setFilter('low', this)">🟢 Low priority</button>
    <button class="filter-btn" onclick="setFilter('done', this)">✅ Done</button>
  </div>
  <div class="progress-bar-wrap" style="margin-top:14px">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="progress-label">
    <span id="progressText">0 of 0 done</span>
    <span id="progressPct">0%</span>
  </div>
</div>

<div class="container" id="container"></div>

<script>
const sections = [
  {
    title: "Missing Content — Needs Writing",
    priority: "high",
    items: [
      {
        title: "Write the Abstract",
        note: "Currently a placeholder comment. Should summarise: motivation, the 3 agents, environments, experiments, and key findings. Aim for ~150 words.",
        priority: "high"
      },
      {
        title: "Write the Conclusions section",
        note: "Completely empty right now. Should restate the core question, summarise what the results showed, and reflect on implications. Don't just repeat the discussion.",
        priority: "high"
      },
      {
        title: "Complete the Results — Baseline section with written analysis",
        note: "Figures are included but there's no written interpretation. Discuss the numbers: final return values, rate of learning, why SAC plateaued fast, why the world model agents lagged.",
        priority: "high"
      },
      {
        title: "Complete the Categorical World Model agent description",
        note: "Currently cuts off mid-sentence: '…It gets mapped to a disctrete…' — needs to explain the straight-through estimator, categorical/VQ encoding, and how it differs from the Gaussian.",
        priority: "high"
      },
      {
        title: "Fill in the Q-Functions and Q-Values background section",
        note: "There is a \\text{Q-Functions and Q-Values} header in the Background section with zero content beneath it. Define Q(s,a), the Bellman equation, and why it's needed for SAC.",
        priority: "high"
      },
      {
        title: "Flesh out Future Work & Limitations into prose",
        note: "Currently just 4 bullet points. Expand into a short paragraph for each: training budget limitations, single-environment scope, world model capacity, and adaptation experiment scope.",
        priority: "high"
      }
    ]
  },
  {
    title: "Incomplete / Broken Sections — Fix These",
    priority: "med",
    items: [
      {
        title: "Complete the Gaussian World Model latent dynamics description",
        note: "The 'Latent Dynamics' subsection cuts off abruptly after 'The gaussian distribution is then sampled by the' — finish this sentence and explain the recurrent/transition model.",
        priority: "high"
      },
      {
        title: "Add justification for choosing SAC as the model-free baseline",
        note: "There's a comment '% Justification for SAC' after the algorithm box but nothing written. One paragraph on why SAC suits continuous control (entropy bonus, off-policy efficiency) over e.g. PPO or TD3.",
        priority: "med"
      },
      {
        title: "Add justification for using a VAE",
        note: "Same issue — '% VAE justification' comment with no text. Briefly justify the VAE choice: why a learned latent over raw states, and why variational over deterministic.",
        priority: "med"
      },
      {
        title: "Write the Adaptation Results sub-section",
        note: "The section header is there but entirely empty. You won't have results yet, but you can write the setup description, what metrics you'll report, and leave figure placeholders.",
        priority: "med"
      },
      {
        title: "Expand the Adaptation Discussion placeholder",
        note: "Currently just 'Discussion about the adaption --'. Pre-write the structure of what you expect to find and the hypotheses, then fill in actuals when results arrive.",
        priority: "med"
      }
    ]
  },
  {
    title: "Writing Quality & Flow",
    priority: "med",
    items: [
      {
        title: "Fix the lowercase paragraph opening in Introduction",
        note: "'like a general IA, RL agents can either be…' — starts lowercase mid-section. Capitalise and consider whether this paragraph needs a smoother transition from the previous one.",
        priority: "med"
      },
      {
        title: "Add a paragraph bridging Introduction to the specific project contribution",
        note: "The intro jumps from broad motivation to the specific agents quickly. Add a short paragraph on the research gap (why this comparison hasn't been done in continuous control) and state your exact contribution clearly.",
        priority: "med"
      },
      {
        title: "Fix bold text formatting in Background section",
        note: "Several \\textbf{} labels (Policy, Policy Updates, Exploration) are missing a newline/paragraph break before them and run directly into the previous paragraph. Also '\\text{Q-Functions…}' should be \\textbf{}.",
        priority: "low"
      },
      {
        title: "Spell-check and fix typos throughout",
        note: "Found: 'disctrete' (Categorical section), 'reinforcment' (Figure 1 caption), 'differers' (VAE section), 'stating' (should be 'starting' in policy update para), 'trail' (should be 'try' in Exploration). Run a full pass.",
        priority: "med"
      },
      {
        title: "Improve consistency of tense and register",
        note: "Some sections are past tense, some present. Methods and background should be present tense; Results should be past tense. Also 'loosely be thought of as' in SAC section could be tightened.",
        priority: "low"
      }
    ]
  },
  {
    title: "Related Work & Citations",
    priority: "med",
    items: [
      {
        title: "Add proper citations for Dreamer-V3 and TD-MPC",
        note: "They are mentioned by name in Related Work but not cited (no \\cite{}). Add Hafner et al. 2023 for DreamerV3 and Hansen et al. for TD-MPC.",
        priority: "high"
      },
      {
        title: "Cite the original SAC paper (Haarnoja et al. 2018)",
        note: "SAC is introduced in Methods but never cited. Add \\cite{haarnoja2018soft} or equivalent.",
        priority: "high"
      },
      {
        title: "Expand Related Work on world model representations",
        note: "Currently the section references Meyer (2024) for discrete vs continuous but could be strengthened with RSSM (Hafner 2019), VQ-VAE (van den Oord 2017), or Gumbel-Softmax (Jang 2017) to better ground the categorical representation.",
        priority: "med"
      },
      {
        title: "Add a short paragraph in Related Work on model-based adaptation / generalisation",
        note: "Your Experiment 2 is about adaptation — but the Related Work doesn't cover prior work on how model-based agents adapt to distribution shift. Add at least one relevant reference.",
        priority: "med"
      }
    ]
  },
  {
    title: "Structure & Presentation",
    priority: "low",
    items: [
      {
        title: "Add a HalfCheetah action/observation table",
        note: "The environment section describes the spaces in prose but a small table of the 17 observation dimensions would help readers. The Gymnasium docs list them explicitly.",
        priority: "low"
      },
      {
        title: "Add an architecture diagram for the world model agents",
        note: "The VAE figure is there, but a diagram showing the full agent loop (encoder → latent → dynamics model → decoder + SAC policy) would make the Methods much clearer. Can be a simple TikZ or imported figure.",
        priority: "low"
      },
      {
        title: "Write a proper Training Procedure / Hyperparameter table",
        note: "Currently just a paragraph. A table of hyperparameters (learning rate, batch size, replay buffer size, latent dim, etc.) for all 3 agents would make the Methods reproducible and fills space well.",
        priority: "med"
      },
      {
        title: "Check figure cross-references are correct",
        note: "Figures 1 and 2 both have \\label{fig:placeholder} — they share the same label which will cause \\cref{} to always resolve to the same figure. Rename them to unique labels.",
        priority: "high"
      },
      {
        title: "Check word count target is on track",
        note: "The wordcount.tex input is present but make sure it's actually being generated (texcount pass) and check you're on pace for your target length.",
        priority: "low"
      }
    ]
  }
];

// Flatten all items for progress tracking
let allItems = [];
sections.forEach((s, si) => s.items.forEach((item, ii) => {
  allItems.push({ sectionIdx: si, itemIdx: ii, done: false });
}));

const KEY = 'dia_checklist_v1';
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { state = {}; }

let currentFilter = 'all';

function saveState() {
  localStorage.setItem(KEY, JSON.stringify(state));
}

function itemKey(si, ii) { return `${si}_${ii}`; }

function isDone(si, ii) { return !!state[itemKey(si, ii)]; }

function toggleItem(si, ii) {
  const k = itemKey(si, ii);
  state[k] = !state[k];
  saveState();
  render();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function updateProgress() {
  let total = 0, done = 0;
  sections.forEach((s, si) => s.items.forEach((item, ii) => {
    total++;
    if (isDone(si, ii)) done++;
  }));
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} of ${total} done`;
  document.getElementById('progressPct').textContent = pct + '%';
}

function priorityClass(p) {
  return p === 'high' ? 'high' : p === 'med' ? 'med' : 'low';
}

function render() {
  const container = document.getElementById('container');
  container.innerHTML = '';

  sections.forEach((section, si) => {
    const filtered = section.items.filter((item, ii) => {
      if (currentFilter === 'all') return true;
      if (currentFilter === 'done') return isDone(si, ii);
      if (currentFilter === 'high') return item.priority === 'high' && !isDone(si, ii);
      if (currentFilter === 'med') return item.priority === 'med' && !isDone(si, ii);
      if (currentFilter === 'low') return item.priority === 'low' && !isDone(si, ii);
      return true;
    });

    if (filtered.length === 0) return;

    const totalInSection = section.items.length;
    const doneInSection = section.items.filter((_, ii) => isDone(si, ii)).length;
    const openKey = `section_open_${si}`;
    const isOpen = state[openKey] !== false; // default open

    const sectionEl = document.createElement('div');
    sectionEl.className = 'section';

    const pc = priorityClass(section.priority);
    const badgeLabel = section.priority === 'high' ? 'High' : section.priority === 'med' ? 'Medium' : 'Low';

    sectionEl.innerHTML = `
      <div class="section-header" onclick="toggleSection(${si})">
        <span class="section-title">${section.title}</span>
        <span class="section-badge badge-${pc}">${badgeLabel}</span>
        <span class="section-count">${doneInSection}/${totalInSection}</span>
        <span class="section-chevron ${isOpen ? 'open' : ''}">▼</span>
      </div>
      <div class="items ${isOpen ? 'open' : ''}">
        ${filtered.map((item, fii) => {
          // find original index
          const ii = section.items.indexOf(item);
          const done = isDone(si, ii);
          const pc2 = priorityClass(item.priority);
          return `
            <div class="item ${done ? 'done' : ''}" onclick="toggleItem(${si}, ${ii})">
              <div class="priority-dot dot-${pc2}"></div>
              <div class="checkbox">${done ? '✓' : ''}</div>
              <div class="item-content">
                <div class="item-title">${item.title}</div>
                <div class="item-note">${item.note}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;

    container.appendChild(sectionEl);
  });

  updateProgress();
}

function toggleSection(si) {
  const openKey = `section_open_${si}`;
  state[openKey] = state[openKey] === false ? true : false;
  saveState();
  render();
}

render();
</script>
</body>
</html>
